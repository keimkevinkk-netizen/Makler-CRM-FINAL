name: VINCERE CI

on:
  pull_request:
    paths:
      - 'apps/vincere/**'
      - '.github/workflows/vincere-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/vincere/**'
      - '.github/workflows/vincere-ci.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vincere
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-report.txt
      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vincere-typecheck-report
          path: apps/vincere/typecheck-report.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Lint
        run: npm run lint -- --format json --output-file lint-report.json
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vincere-lint-report
          path: apps/vincere/lint-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Tests
        run: npm test -- --reporter=json --outputFile=test-report.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vincere-test-report
          path: apps/vincere/test-report.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Production build
        run: npm run build
