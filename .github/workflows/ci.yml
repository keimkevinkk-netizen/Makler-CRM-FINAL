name: Apply PR11 Final Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-execution-core-v1
          fetch-depth: 0

      - name: Reconstruct and verify reviewed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          root = Path('.github/pr11-patch')
          parts = [
              root / 'chunk00',
              root / 'chunk01',
              *(root / f'replacement02-{index:02d}' for index in range(4)),
              root / 'chunk03',
              root / 'chunk04',
              root / 'chunk05',
              root / 'chunk06',
              root / 'chunk07',
              root / 'chunk08',
          ]
          missing = [str(path) for path in parts if not path.is_file()]
          assert not missing, f'missing patch parts: {missing}'
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          assert len(encoded) == 64120, f'unexpected encoded length: {len(encoded)}'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '180f60cd6d27685da13229faa1537597cb5d26098c59e6ad1bfbd3400666e326', digest
          Path('/tmp/pr11-final.patch').write_bytes(patch)

          additions = [
              ('followup.patch.b64', 'c43f5285849ba1ecbd0421d53b9a259019a457c9dc6914def057a0db0c9abd68', '/tmp/pr11-followup.patch'),
              ('diagnostic.patch.b64', 'b3a390b653293e4e6aadaec053ec5a98a32b3901ff21549e3213a11c2da73955', '/tmp/pr11-diagnostic.patch'),
              ('reloadfix.patch.b64', '66f3904cc7e1cb65b709ddc814b1f3cd0896d8a0c73ec817c1a216960d8094a7', '/tmp/pr11-reloadfix.patch'),
              ('lintfix.patch.b64', '73cc406b47b46c5aa7cafa8f44dede7cc111b66baa38f9349fee4eee1abfd891', '/tmp/pr11-lintfix.patch'),
          ]
          for filename, expected, target in additions:
              decoded = base64.b64decode((root / filename).read_text(encoding='utf-8').strip(), validate=True)
              actual = hashlib.sha256(decoded).hexdigest()
              assert actual == expected, f'{filename}: {actual}'
              Path(target).write_bytes(decoded)
          print('All reviewed patches reconstructed and checksum-verified.')
          PY

      - name: Apply reviewed patch cleanly
        run: |
          for patch in /tmp/pr11-final.patch /tmp/pr11-followup.patch /tmp/pr11-diagnostic.patch /tmp/pr11-reloadfix.patch /tmp/pr11-lintfix.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax, lint, audit and function tests
        run: |
          npm run check:functions
          npm run lint
          npm audit --audit-level=high
          npm run test:functions

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E - final Sales Execution Core review
        shell: bash
        run: |
          set +e
          node tests/e2e/test-sales-execution-core.js > /tmp/sales-core-e2e.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/sales-core-e2e.status
          cat /tmp/sales-core-e2e.log
          exit "$status"

      - name: Upload Sales Core E2E diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-core-e2e-diagnostic-${{ github.sha }}
          path: |
            /tmp/sales-core-e2e.log
            /tmp/sales-core-e2e.status
          retention-days: 1

      - name: E2E - verify.js
        run: node tests/e2e/verify.js

      - name: E2E - accessibility focus restore
        run: node tests/e2e/test-a11y-focus-restore.js

      - name: E2E - datasource registry
        run: node tests/e2e/test-datasource-registry.js

      - name: E2E - official GIS
        run: node tests/e2e/test-official-gis.js

      - name: E2E - repository layer
        run: node tests/e2e/test-repository-layer.js

      - name: E2E - chart canvas reuse
        run: node tests/e2e/test-chart-canvas-reuse.js

      - name: E2E - data quality sentinel
        run: node tests/e2e/test-data-quality-sentinel.js

      - name: E2E - masterprompt P0
        run: node tests/e2e/test-masterprompt-p0.js

      - name: E2E - masterprompt P1
        run: node tests/e2e/test-masterprompt-p1.js

      - name: E2E - masterprompt P2
        run: node tests/e2e/test-masterprompt-p2.js

      - name: E2E - masterprompt P3
        run: node tests/e2e/test-masterprompt-p3.js

      - name: E2E - map fixes
        run: node tests/e2e/test-map-fixes.js

      - name: E2E - market geocode order
        run: node tests/e2e/test-market-geocode-order.js

      - name: E2E - central objects migration
        run: node tests/e2e/test-central-objects-migration.js

      - name: E2E - central object editor
        run: node tests/e2e/test-central-object-editor-single-form.js

      - name: Restore permanent CI and remove staging chunks
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          printf '\n      - name: E2E - test-sales-execution-core.js\n        run: node tests/e2e/test-sales-execution-core.js\n' >> .github/workflows/ci.yml
          rm -rf .github/pr11-patch
          git diff --check

      - name: Commit reviewed implementation to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(sales): finalize safe execution core review'
          git push origin HEAD:feat/sales-execution-core-v1
