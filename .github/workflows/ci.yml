name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Temporary source snapshot for final PR review
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check Netlify Functions
        run: npm run check:functions

      - name: Lint (netlify/functions + tests)
        run: npm run lint

      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright environment info
        run: |
          node --version
          npx playwright --version
          node -e "console.log('playwright-core:', require('playwright-core/package.json').version)"

      - name: Run function-level tests (no browser, no network)
        run: npm run test:functions

      # Split into one step per file (instead of one combined "test:e2e:full"
      # step) so a failure's step name alone identifies which specific test
      # crashed - this repo's CI runs in an environment we cannot get raw logs
      # from interactively, so step-name granularity is the primary diagnostic.
      - name: E2E - verify.js (full tab/XSS/overflow regression)
        run: node tests/e2e/verify.js

      - name: E2E - test-a11y-focus-restore.js
        run: node tests/e2e/test-a11y-focus-restore.js

      - name: E2E - test-datasource-registry.js
        run: node tests/e2e/test-datasource-registry.js

      - name: E2E - test-official-gis.js
        run: node tests/e2e/test-official-gis.js

      - name: E2E - test-repository-layer.js
        run: node tests/e2e/test-repository-layer.js

      - name: E2E - test-chart-canvas-reuse.js
        run: node tests/e2e/test-chart-canvas-reuse.js

      - name: E2E - test-data-quality-sentinel.js
        run: node tests/e2e/test-data-quality-sentinel.js

      - name: E2E - test-masterprompt-p0.js
        run: node tests/e2e/test-masterprompt-p0.js

      - name: E2E - test-masterprompt-p1.js
        run: node tests/e2e/test-masterprompt-p1.js

      - name: E2E - test-masterprompt-p2.js
        run: node tests/e2e/test-masterprompt-p2.js

      - name: E2E - test-masterprompt-p3.js
        run: node tests/e2e/test-masterprompt-p3.js

      - name: E2E - test-map-fixes.js
        run: node tests/e2e/test-map-fixes.js

      - name: E2E - test-market-geocode-order.js
        run: node tests/e2e/test-market-geocode-order.js

      - name: E2E - test-central-objects-migration.js
        run: node tests/e2e/test-central-objects-migration.js

      - name: E2E - test-central-object-editor-single-form.js
        run: node tests/e2e/test-central-object-editor-single-form.js

      - name: E2E - test-sales-execution-core.js
        run: node tests/e2e/test-sales-execution-core.js
