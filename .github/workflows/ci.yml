name: Apply PR11 Final Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-execution-core-v1
          fetch-depth: 0

      - name: Reconstruct and verify reviewed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          root = Path('.github/pr11-patch')
          parts = [
              root / 'chunk00',
              root / 'chunk01',
              *(root / f'replacement02-{index:02d}' for index in range(4)),
              root / 'chunk03',
              root / 'chunk04',
              root / 'chunk05',
              root / 'chunk06',
              root / 'chunk07',
              root / 'chunk08',
          ]
          missing = [str(path) for path in parts if not path.is_file()]
          assert not missing, f'missing patch parts: {missing}'
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          assert len(encoded) == 64120, f'unexpected encoded length: {len(encoded)}'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          expected = '180f60cd6d27685da13229faa1537597cb5d26098c59e6ad1bfbd3400666e326'
          assert digest == expected, f'checksum mismatch: {digest}'
          Path('/tmp/pr11-final.patch').write_bytes(patch)
          print(f'reconstructed {len(patch)} bytes from {len(encoded)} base64 characters; sha256={digest}')
          PY

      - name: Apply reviewed patch cleanly
        run: |
          git apply --check /tmp/pr11-final.patch
          git apply /tmp/pr11-final.patch
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax, lint, audit and function tests
        run: |
          npm run check:functions
          npm run lint
          npm audit --audit-level=high
          npm run test:functions

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Full browser regression suite
        run: npm run test:e2e:full

      - name: Restore permanent CI and remove staging chunks
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          printf '\n      - name: E2E - test-sales-execution-core.js\n        run: node tests/e2e/test-sales-execution-core.js\n' >> .github/workflows/ci.yml
          rm -rf .github/pr11-patch
          git diff --check

      - name: Commit reviewed implementation to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(sales): finalize safe execution core review'
          git push origin HEAD:feat/sales-execution-core-v1
