name: Apply PR11 Final Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-execution-core-v1
          fetch-depth: 0

      - name: Reconstruct and verify reviewed patch
        run: |
          cat .github/pr11-patch/chunk* | base64 -d | gzip -d > /tmp/pr11-final.patch
          echo '180f60cd6d27685da13229faa1537597cb5d26098c59e6ad1bfbd3400666e326  /tmp/pr11-final.patch' | sha256sum -c -
          git apply --check /tmp/pr11-final.patch
          git apply /tmp/pr11-final.patch
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax, lint, audit and function tests
        run: |
          npm run check:functions
          npm run lint
          npm audit --audit-level=high
          npm run test:functions

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Full browser regression suite
        run: npm run test:e2e:full

      - name: Restore permanent CI and remove staging chunks
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          printf '\n      - name: E2E - test-sales-execution-core.js\n        run: node tests/e2e/test-sales-execution-core.js\n' >> .github/workflows/ci.yml
          rm -rf .github/pr11-patch
          git diff --check

      - name: Commit reviewed implementation to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(sales): finalize safe execution core review'
          git push origin HEAD:feat/sales-execution-core-v1
